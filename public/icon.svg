<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171717" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Dark Carbon Backplate -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#262626" stroke-width="4" />

  <!-- Speedometer / Tachometer Dial Outer Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#262626" stroke-width="16" />
  
  <!-- Glowing Amber 2,000 km Arc -->
  <path d="M 128 384 A 180 180 0 1 1 384 384" fill="none" stroke="url(#amberGrad)" stroke-width="20" stroke-linecap="round" filter="url(#glow)" />

  <!-- Tick Marks -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#404040" stroke-width="2" stroke-dasharray="4 24" />

  <!-- Center Hub -->
  <circle cx="256" cy="256" r="38" fill="#171717" stroke="#f59e0b" stroke-width="6" />
  <circle cx="256" cy="256" r="16" fill="#f59e0b" />

  <!-- Needle Pointing to High Performance Zone -->
  <polygon points="256,236 248,256 256,120 264,256" fill="#f59e0b" filter="url(#glow)" />

  <!-- Digital '2K' Mileage Marker Badge -->
  <text x="256" y="340" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="2">2000 KM</text>
  <text x="256" y="375" fill="#a3a3a3" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="4">SERVICE</text>
</svg>
